# MediAudit-X local stack: Elasticsearch + backend (FastAPI) + frontend (Next.js).
#
#   docker compose up --build     first run (builds images, loads sample data)
#   docker compose up             later runs
#   docker compose down           stop  (add -v to also wipe Elasticsearch data)
#
# UI http://localhost:3000 · API docs http://localhost:8000/docs
#
# backend/app and frontend/app are mounted into the containers and both
# servers hot-reload, so code edits show up without rebuilding. Rebuild
# (--build) after changing requirements.txt, package.json or config files.
#
# Ports: override with ES_PORT / BACKEND_PORT / FRONTEND_PORT if taken,
# e.g.  ES_PORT=9201 docker compose up. Needs Docker Compose 2.24+.
#
# The backend always uses the Elasticsearch container below. backend/.env
# is still read if present (for AWS / Anthropic keys); any Elastic Cloud
# settings in it are overridden.

name: mediaudit-x

services:
  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:9.2.0
    environment:
      - discovery.type=single-node
      - xpack.security.enabled=false
      - ES_JAVA_OPTS=-Xms1g -Xmx1g
    ports:
      - "${ES_PORT:-9200}:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf 'http://localhost:9200/_cluster/health?wait_for_status=yellow&timeout=5s' || exit 1"]
      interval: 5s
      timeout: 10s
      retries: 30

  setup:
    build: ./backend
    command: ["sh", "./docker-setup.sh"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: &backend-env
      ELASTIC_URL: http://elasticsearch:9200
      ELASTIC_CLOUD_ID: ""
      ELASTIC_API_KEY: ""
      ELASTIC_USERNAME: ""
      ELASTIC_PASSWORD: ""
    volumes:
      - ./backend/app:/app/app
      # Loaders resolve data/ four levels above their file, i.e. /data here.
      - ./data:/data
    depends_on:
      elasticsearch:
        condition: service_healthy

  backend:
    build: ./backend
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]
    env_file:
      - path: ./backend/.env
        required: false
    environment: *backend-env
    ports:
      - "${BACKEND_PORT:-8000}:8000"
    volumes:
      - ./backend/app:/app/app
      - ./data:/data
      - uploads:/app/uploads
    depends_on:
      setup:
        condition: service_completed_successfully

  frontend:
    build: ./frontend
    environment:
      # The browser calls the API directly, so this is the host-side URL.
      NEXT_PUBLIC_API_BASE_URL: http://localhost:${BACKEND_PORT:-8000}
      WATCHPACK_POLLING: "true"  # file-change detection through Docker Desktop mounts
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    volumes:
      - ./frontend/app:/app/app
    depends_on:
      - backend

volumes:
  es-data:
  uploads:
